<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="520" viewBox="0 0 1110 520" role="img" aria-labelledby="title desc">
  <title id="title">Replace one temporary component at a time</title>
  <desc id="desc">Three architectural snapshots show the application evolving from a frontend with a mock service, to a real backend with temporary in-memory state, to a complete local application backed by SQLite.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#15803d"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <symbol id="icon-api" viewBox="0 0 24 24">
        <path d="m8 5-5 7 5 7M16 5l5 7-5 7M14 3l-4 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-browser" viewBox="0 0 32 22">
        <rect x="1" y="1.5" width="30" height="19" rx="2.25" fill="none" stroke="currentColor" stroke-width="1.75" vector-effect="non-scaling-stroke"/>
        <path d="M1.5 6.5h29" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
        <circle cx="4" cy="4" r=".48" fill="currentColor"/>
        <circle cx="6.2" cy="4" r=".48" fill="currentColor"/>
        <circle cx="8.4" cy="4" r=".48" fill="currentColor"/>
        <rect x="12" y="3.3" width="15" height="1.5" rx=".75" fill="currentColor" opacity=".35"/>
      </symbol>
    <symbol id="icon-database" viewBox="0 0 24 24">
        <ellipse cx="12" cy="5" rx="8" ry="3" fill="none" stroke="currentColor" stroke-width="1.75" vector-effect="non-scaling-stroke"/>
        <path d="M4 5v7c0 1.66 3.58 3 8 3s8-1.34 8-3V5M4 12v7c0 1.66 3.58 3 8 3s8-1.34 8-3v-7" fill="none" stroke="currentColor" stroke-width="1.75" vector-effect="non-scaling-stroke"/>
      </symbol>
    <symbol id="icon-number-1" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 9.5 12.4 8v8M10.2 16h4.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-number-2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.4 9.6a2.6 2.6 0 1 1 5.2.4c0 2-5.2 3.6-5.2 6h5.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-number-3" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.5 9a2.5 2.5 0 1 1 2.7 3h-.7.7a2.6 2.6 0 1 1-2.8 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .node rect { stroke-width: 2; }
      .node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-size: 14px; font-weight: 500; fill: #64748b; text-anchor: middle; }
      .node-subtitle.icon-copy { text-anchor: start; }
      .eyebrow { font-size: 12px; font-weight: 750; letter-spacing: 1px; fill: #64748b; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 7 7; }
      .center-title { font-size: 16px; font-weight: 800; letter-spacing: 1.3px; fill: #334155; text-anchor: middle; }
      .center-detail { font-size: 13px; font-weight: 600; fill: #64748b; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1110" height="520" fill="#ffffff"/>

  <line class="divider" x1="16" y1="195" x2="1026" y2="195"/>
  <line class="divider" x1="16" y1="357" x2="1026" y2="357"/>

  <path class="edge" d="M500 98L580 98" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
  <path class="edge" d="M500 260L580 260" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
  <path class="edge" d="M800 260L918 260" stroke="#c2410c" marker-end="url(#arrow-amber)"/>
  <path class="edge" d="M500 422L580 422" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
  <path class="edge" d="M800 422L918 422" stroke="#15803d" marker-end="url(#arrow-green)"/>

  <g class="node node-plain node-blue" transform="translate(40 53)">
    <use href="#icon-number-1" x="16" y="31" width="28" height="28" color="#2563eb"/>
    <text class="node-title icon-copy" x="56" y="51">Prototype</text>
    <text class="node-subtitle icon-copy" x="56" y="76">Test the experience</text>
  </g>
  <g class="node-icon-only node-purple" transform="translate(340 42)">
    <use href="#icon-browser" x="0" y="0" width="160" height="112" color="#7c3aed"/>
    <text class="icon-node-title" x="80" y="137">Frontend</text>
  </g>
  <g class="node node-purple" transform="translate(580 53)" filter="url(#shadow)">
    <rect width="220" height="90" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <use href="#icon-settings" x="16" y="31" width="28" height="28" color="#7c3aed"/>
    <text class="node-title icon-copy" x="56" y="51">Mock service</text>
    <text class="node-subtitle" x="110" y="76">No backend yet</text>
  </g>
  <g class="node node-plain node-amber" transform="translate(40 215)">
    <use href="#icon-number-2" x="16" y="31" width="28" height="28" color="#c2410c"/>
    <text class="node-title icon-copy" x="56" y="51">Integration</text>
    <text class="node-subtitle icon-copy" x="56" y="76">Test the API boundary</text>
  </g>
  <g class="node-icon-only node-purple" transform="translate(340 204)">
    <use href="#icon-browser" x="0" y="0" width="160" height="112" color="#7c3aed"/>
    <text class="icon-node-title" x="80" y="137">Frontend</text>
  </g>
  <g class="node node-amber" transform="translate(580 215)" filter="url(#shadow)">
    <rect width="220" height="90" rx="18" fill="#fff7ed" stroke="#c2410c"/>
    <use href="#icon-api" x="16" y="31" width="28" height="28" color="#c2410c"/>
    <text class="node-title icon-copy" x="56" y="51">FastAPI backend</text>
    <text class="node-subtitle" x="110" y="76">Real API</text>
  </g>
  <g class="node-icon-only node-gray" transform="translate(918 218)">
    <use href="#icon-database" x="0" y="0" width="84" height="84" color="#64748b"/>
    <text class="icon-node-title" x="42" y="109">In-memory store</text>
  </g>
  <g class="node node-plain node-green" transform="translate(40 377)">
    <use href="#icon-number-3" x="16" y="31" width="28" height="28" color="#15803d"/>
    <text class="node-title icon-copy" x="56" y="51">Local app</text>
    <text class="node-subtitle icon-copy" x="56" y="76">Keep state after restart</text>
  </g>
  <g class="node-icon-only node-purple" transform="translate(340 366)">
    <use href="#icon-browser" x="0" y="0" width="160" height="112" color="#7c3aed"/>
    <text class="icon-node-title" x="80" y="137">Frontend</text>
  </g>
  <g class="node node-amber" transform="translate(580 377)" filter="url(#shadow)">
    <rect width="220" height="90" rx="18" fill="#fff7ed" stroke="#c2410c"/>
    <use href="#icon-api" x="16" y="31" width="28" height="28" color="#c2410c"/>
    <text class="node-title icon-copy" x="56" y="51">FastAPI backend</text>
    <text class="node-subtitle" x="110" y="76">Real API</text>
  </g>
  <g class="node-icon-only node-green" transform="translate(918 380)">
    <use href="#icon-database" x="0" y="0" width="84" height="84" color="#15803d"/>
    <text class="icon-node-title" x="42" y="109">SQLite database</text>
  </g>
</svg>
