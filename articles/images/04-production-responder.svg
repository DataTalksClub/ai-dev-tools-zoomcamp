<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="500" viewBox="0 0 1270 500" role="img" aria-labelledby="title desc">
  <title id="title">Run an agent only for the incident</title>
  <desc id="desc">An alert enters an AWS trigger path through SNS and Lambda. Lambda starts an isolated container job for an agent with access to code, logs, and metrics. The job writes a session log, which remains after the compute terminates.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#15803d"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <symbol id="icon-alert" viewBox="0 0 24 24">
        <path d="M5 17h14l-2-3V9a5 5 0 0 0-10 0v5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10 20h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-document" viewBox="0 0 24 24">
        <path d="M6 2h8l4 4v16H6Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 2v5h4M9 12h6M9 16h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-github" viewBox="0 0 24 24">
        <path fill="currentColor" d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.11.79-.25.79-.56v-2.23c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.04 1.77 2.72 1.26 3.38.96.1-.75.4-1.26.74-1.55-2.57-.29-5.27-1.28-5.27-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.16 1.18a10.9 10.9 0 0 1 5.76 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.71 5.38-5.29 5.67.42.36.79 1.06.79 2.14v3.27c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/>
      </symbol>
    <symbol id="icon-lambda" viewBox="0 0 24 24">
        <path d="M7 2.5h3L18 21.5M12.5 9.5 5.5 21.5" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-observability" viewBox="0 0 24 24">
        <rect x="2" y="3" width="17" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M6 13v-3M10 13V7M14 13V9M7 21h7M10.5 17v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="18" cy="15" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="18" cy="15" r="1" fill="currentColor"/>
        <path d="m21 18 2 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-queue" viewBox="0 0 56 28">
        <path d="M5 8h46M5 20h46" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <ellipse cx="5" cy="14" rx="3.5" ry="6" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <ellipse cx="51" cy="14" rx="3.5" ry="6" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="1.8"/>
      </symbol>
    <symbol id="icon-robot" viewBox="0 0 24 24">
        <path d="M12 5V2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="12" cy="2.5" r="1" fill="currentColor"/>
        <rect x="4" y="5" width="16" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M4 10H2.5v5H4M20 10h1.5v5H20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="9" cy="11" r="1.3" fill="currentColor"/>
        <circle cx="15" cy="11" r="1.3" fill="currentColor"/>
        <path d="M8.5 16h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-size: 20px; font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-size: 16px; font-weight: 500; fill: #475569; text-anchor: middle; }
      .eyebrow { font-size: 13px; font-weight: 750; letter-spacing: 1px; fill: #475569; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #f1f5f9; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #334155; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #475569; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1270" height="500" fill="#ffffff"/>

  <g class="node-boundary node-amber" transform="translate(250 30)">
    <rect width="760" height="250" rx="22" fill="none" stroke="#c2410c"/>
    <text class="boundary-title" x="20" y="31">AWS trigger path</text>
  </g>
  <g class="node-boundary node-blue" transform="translate(555 320)">
    <rect width="610" height="160" rx="22" fill="none" stroke="#2563eb"/>
    <text class="boundary-title" x="20" y="31">Agent access</text>
  </g>
  <path class="edge-boundary-halo" d="M151 160L327.02 160" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M151 160L327.02 160" stroke="#dc2626" marker-end="url(#arrow-red)"/>
  <path class="edge" d="M432.98 160L606 160" stroke="#c2410c" marker-end="url(#arrow-amber)"/>
  <path class="edge" d="M634 160L750 160" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
  <path class="edge-boundary-halo" d="M860 320L860 210" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M860 320L860 210" stroke="#2563eb" stroke-dasharray="8 8" marker-end="url(#arrow-blue)"/>
  <path class="edge-boundary-halo" d="M970 160L1030 160" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M970 160L1030 160" stroke="#15803d" marker-end="url(#arrow-green)"/>

  <g class="node-icon-only node-red" transform="translate(102 132)">
    <use href="#icon-alert" x="0" y="0" width="56" height="56" color="#dc2626"/>
    <text class="icon-node-title" x="28" y="81">Alert</text>
  </g>
  <g class="node-icon-only node-amber" transform="translate(324 132)">
    <use href="#icon-queue" x="0" y="0" width="112" height="56" color="#c2410c"/>
    <text class="icon-node-title" x="56" y="81">SNS topic</text>
  </g>
  <g class="node-icon-only node-amber" transform="translate(592 132)">
    <use href="#icon-lambda" x="0" y="0" width="56" height="56" color="#c2410c"/>
    <text class="icon-node-title" x="28" y="81">Lambda</text>
  </g>
  <g class="node node-purple" transform="translate(750 110)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <use href="#icon-robot" x="16" y="20" width="34" height="34" color="#7c3aed"/>
    <text class="node-title icon-copy" x="62" y="43.12" font-size="17">Agent</text>
    <text class="node-subtitle" x="110" y="75" font-size="16">Container job</text>
  </g>
  <g class="node node-blue" transform="translate(570 380)" filter="url(#shadow)">
    <rect width="150" height="70" rx="16" fill="#eff6ff" stroke="#2563eb"/>
    <use href="#icon-github" x="16" y="19" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="62" y="27" font-size="17">Code</text>
  </g>
  <g class="node node-blue" transform="translate(785 380)" filter="url(#shadow)">
    <rect width="150" height="70" rx="16" fill="#eff6ff" stroke="#2563eb"/>
    <use href="#icon-document" x="16" y="19" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="62" y="27" font-size="17">Logs</text>
  </g>
  <g class="node node-blue" transform="translate(1000 380)" filter="url(#shadow)">
    <rect width="150" height="70" rx="16" fill="#eff6ff" stroke="#2563eb"/>
    <use href="#icon-observability" x="16" y="19" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="62" y="27" font-size="17">Metrics</text>
  </g>
  <g class="node node-green" transform="translate(1030 110)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#ecfdf5" stroke="#15803d"/>
    <use href="#icon-document" x="16" y="20" width="34" height="34" color="#15803d"/>
    <text class="node-title icon-copy" x="62" y="43.12" font-size="17">Session log</text>
    <text class="node-subtitle" x="110" y="75" font-size="16">Saved after the run</text>
  </g>
</svg>
