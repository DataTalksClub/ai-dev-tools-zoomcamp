<svg xmlns="http://www.w3.org/2000/svg" width="780" height="620" viewBox="0 0 780 620" role="img" aria-labelledby="title desc">
  <title id="title">Metrics, logs, and traces</title>
  <desc id="desc">An application produces three kinds of telemetry. Metrics appear as time-series measurements, logs as timestamped event records, and traces as a waterfall of spans for one request.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#15803d"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <symbol id="icon-api" viewBox="0 0 24 24">
        <path d="m8 5-5 7 5 7M16 5l5 7-5 7M14 3l-4 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-size: 20px; font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-size: 16px; font-weight: 500; fill: #475569; text-anchor: middle; }
      .eyebrow { font-size: 13px; font-weight: 750; letter-spacing: 1px; fill: #475569; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #f1f5f9; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #334155; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #475569; text-anchor: middle; }
    </style>
  </defs>
  <rect width="780" height="620" fill="#ffffff"/>

  <path class="edge" d="M260 293.33L340 115" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
  <path class="edge" d="M260 310L340 310" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
  <path class="edge" d="M260 326.67L340 505" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>

  <g class="node node-blue" transform="translate(40 260)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <use href="#icon-api" x="16" y="25.88" width="42" height="42" color="#2563eb"/>
    <text class="node-title icon-copy" x="73" y="54.08" font-size="20">Application</text>
  </g>
  <g class="node-specimen node-purple specimen-series" transform="translate(340 40)" filter="url(#shadow)">
    <rect width="400" height="150" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="24" y="31" font-size="24" font-weight="750" text-anchor="start" fill="#172033">Metrics</text>
    <path d="M24 122V51M24 122H190" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M24 98H190M24 74H190" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 5"/>
    <path d="M28 108L52 101L76 104L100 84L124 89L148 63L186 70" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M28 115L52 112L76 99L100 103L124 78L148 82L186 57" fill="none" stroke="#7c3aed" stroke-opacity=".45" stroke-width="2" stroke-dasharray="5 4"/>
    <line x1="220" y1="57" x2="236" y2="57" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="246" y="62" font-size="18" font-weight="600" text-anchor="start" fill="#475569">42 requests/s</text>
    <line x1="220" y1="86" x2="236" y2="86" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="4 3"/>
    <text x="246" y="91" font-size="18" font-weight="600" text-anchor="start" fill="#475569">180 ms latency</text>
    <line x1="220" y1="115" x2="236" y2="115" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="246" y="120" font-size="18" font-weight="600" text-anchor="start" fill="#475569">3 errors/min</text>
  </g>
  <g class="node-specimen node-purple specimen-record" transform="translate(340 235)" filter="url(#shadow)">
    <rect width="400" height="150" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="24" y="31" font-size="24" font-weight="750" text-anchor="start" fill="#172033">Logs</text>
    <rect x="20" y="46" width="360" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="34" cy="65" r="3" fill="#7c3aed"/>
    <text x="46" y="70" font-size="18" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" fill="#475569">12:04:07 ERROR</text>
    <circle cx="34" cy="90" r="3" fill="#7c3aed"/>
    <text x="46" y="95" font-size="18" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" fill="#475569">Database query failed</text>
    <circle cx="34" cy="115" r="3" fill="#7c3aed"/>
    <text x="46" y="120" font-size="18" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" fill="#475569">room_id=184</text>
  </g>
  <g class="node-specimen node-purple specimen-waterfall" transform="translate(340 430)" filter="url(#shadow)">
    <rect width="400" height="150" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="24" y="31" font-size="24" font-weight="750" text-anchor="start" fill="#172033">Traces</text>
    <text x="24" y="63" font-size="18" font-weight="600" text-anchor="start" fill="#475569">POST /rooms</text>
    <rect x="160" y="50" width="205" height="14" rx="7" fill="#7c3aed" fill-opacity="0.9"/>
    <text x="24" y="91" font-size="18" font-weight="600" text-anchor="start" fill="#475569">validate input</text>
    <rect x="182" y="78" width="150" height="14" rx="7" fill="#7c3aed" fill-opacity="0.7"/>
    <text x="24" y="119" font-size="18" font-weight="600" text-anchor="start" fill="#475569">database query</text>
    <rect x="204" y="106" width="105" height="14" rx="7" fill="#7c3aed" fill-opacity="0.5"/>
  </g>
</svg>
