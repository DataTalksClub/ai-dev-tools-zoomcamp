<svg xmlns="http://www.w3.org/2000/svg" width="940" height="720" viewBox="0 0 940 720" role="img" aria-labelledby="title desc">
  <title id="title">Observability is a layered system</title>
  <desc id="desc">An application emits metrics, logs, and traces through an OpenTelemetry Collector. The collector sends all three signals to telemetry storage with shared service, environment, and version context. Dashboards support investigation, while alert rules independently detect user impact.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#15803d"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <symbol id="icon-api" viewBox="0 0 24 24">
        <path d="m8 5-5 7 5 7M16 5l5 7-5 7M14 3l-4 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-collector" viewBox="0 0 24 24">
        <path d="M3 6h5M3 12h5M3 18h5M16 6h5M16 12h5M16 18h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <rect x="8" y="4" width="8" height="16" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M10.5 8h3M10.5 12h3M10.5 16h3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="m16 16 4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-warning" viewBox="0 0 24 24">
        <path d="M12 3 2.5 21h19Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 9v5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.5" r="1.1" fill="currentColor"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-size: 20px; font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-size: 16px; font-weight: 500; fill: #475569; text-anchor: middle; }
      .eyebrow { font-size: 13px; font-weight: 750; letter-spacing: 1px; fill: #475569; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #f1f5f9; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #334155; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #475569; text-anchor: middle; }
    </style>
  </defs>
  <rect width="940" height="720" fill="#ffffff"/>

  <g class="node-boundary node-purple" transform="translate(40 330)">
    <rect width="860" height="220" rx="22" fill="none" stroke="#7c3aed"/>
    <text class="boundary-title" x="20" y="31">Telemetry</text>
  </g>
  <path class="edge" d="M470 140L470 180" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
  <path class="edge-boundary-halo" d="M470 280L470 330" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M470 280L470 330" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
  <path class="edge-boundary-halo" d="M470 550L290 600" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M470 550L290 600" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <path class="edge-boundary-halo" d="M470 550L650 600" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M470 550L650 600" stroke="#dc2626" marker-end="url(#arrow-red)"/>

  <g class="node node-blue" transform="translate(360 40)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <use href="#icon-api" x="16" y="9" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="62" y="32.12" font-size="17">Application</text>
    <text class="node-subtitle" x="110" y="64" font-size="16">Emit metrics, logs,</text>
    <text class="node-subtitle" x="110" y="86" font-size="16">traces</text>
  </g>
  <g class="node node-purple" transform="translate(360 180)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <use href="#icon-collector" x="16" y="20" width="34" height="34" color="#7c3aed"/>
    <text class="node-title icon-copy" x="62" y="43.12" font-size="17">OTel Collector</text>
    <text class="node-subtitle" x="110" y="75" font-size="16">Receive OTLP</text>
  </g>
  <g class="node node-purple" transform="translate(80 380)" filter="url(#shadow)">
    <rect width="220" height="80" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <text class="node-title" x="110" y="33.12" font-size="17">Metrics</text>
    <text class="node-subtitle" x="110" y="65" font-size="16">Rates and counts</text>
  </g>
  <g class="node node-purple" transform="translate(360 380)" filter="url(#shadow)">
    <rect width="220" height="80" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <text class="node-title" x="110" y="33.12" font-size="17">Logs</text>
    <text class="node-subtitle" x="110" y="65" font-size="16">Events and detail</text>
  </g>
  <g class="node node-purple" transform="translate(640 380)" filter="url(#shadow)">
    <rect width="220" height="80" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <text class="node-title" x="110" y="33.12" font-size="17">Traces</text>
    <text class="node-subtitle" x="110" y="65" font-size="16">Request paths</text>
  </g>
  <g class="node node-plain node-gray" transform="translate(250 470)">
    <text class="node-title" x="220" y="27" font-size="17">Shared context</text>
    <text class="node-subtitle" x="220" y="50" font-size="16">Service • environment • deployed version</text>
  </g>
  <g class="node node-blue" transform="translate(180 600)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <use href="#icon-search" x="16" y="9" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="62" y="32.12" font-size="17">Dashboards</text>
    <text class="node-subtitle" x="110" y="64" font-size="16">Investigate what</text>
    <text class="node-subtitle" x="110" y="86" font-size="16">happened</text>
  </g>
  <g class="node node-red" transform="translate(540 600)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#fef2f2" stroke="#dc2626"/>
    <use href="#icon-warning" x="16" y="20" width="34" height="34" color="#dc2626"/>
    <text class="node-title icon-copy" x="62" y="43.12" font-size="17">Alert rules</text>
    <text class="node-subtitle" x="110" y="75" font-size="16">Detect user impact</text>
  </g>
</svg>
