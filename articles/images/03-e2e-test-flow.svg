<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">Test two browser sessions with Playwright</title>
  <desc id="desc">Playwright controls separate interviewer and candidate browser sessions. Both connect to the same interview room through FastAPI, and the test verifies that a candidate change reaches the interviewer and is persisted in Postgres.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#15803d"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <symbol id="icon-api" viewBox="0 0 24 24">
        <path d="m8 5-5 7 5 7M16 5l5 7-5 7M14 3l-4 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-browser" viewBox="0 0 32 22">
        <rect x="1" y="1.5" width="30" height="19" rx="2.25" fill="none" stroke="currentColor" stroke-width="2.67"/>
        <path d="M1.5 6.5h29" fill="none" stroke="currentColor" stroke-width="2.67"/>
        <circle cx="4" cy="4" r=".48" fill="currentColor"/>
        <circle cx="6.2" cy="4" r=".48" fill="currentColor"/>
        <circle cx="8.4" cy="4" r=".48" fill="currentColor"/>
        <rect x="12" y="3.3" width="15" height="1.5" rx=".75" fill="currentColor" opacity=".35"/>
      </symbol>
    <symbol id="icon-database" viewBox="0 0 24 24">
        <ellipse cx="12" cy="5" rx="8" ry="3" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M4 5v7c0 1.66 3.58 3 8 3s8-1.34 8-3V5M4 12v7c0 1.66 3.58 3 8 3s8-1.34 8-3v-7" fill="none" stroke="currentColor" stroke-width="2"/>
      </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-websocket" viewBox="0 0 24 24">
        <path d="M4 7a8 8 0 0 1 12.8-2.1M20 17a8 8 0 0 1-12.8 2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="m14 3 3 2-2 3M10 21l-3-2 2-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8.5 9 6 12l2.5 3M15.5 9l2.5 3-2.5 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-size: 20px; font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-size: 16px; font-weight: 500; fill: #475569; text-anchor: middle; }
      .eyebrow { font-size: 13px; font-weight: 750; letter-spacing: 1px; fill: #475569; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #f1f5f9; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #334155; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #475569; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1100" height="650" fill="#ffffff"/>

  <path class="edge" d="M135 270L135 111L290 111" stroke="#2563eb" stroke-dasharray="8 8" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M135 380L135 539L290 539" stroke="#2563eb" stroke-dasharray="8 8" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M450 111L620 111L620 270" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
  <path class="edge" d="M450 539L620 539L620 380" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
  <path class="edge" d="M740 325L790 325" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
  <path class="edge" d="M910 380L910 488.5" stroke="#15803d" marker-end="url(#arrow-green)"/>

  <g class="node node-blue" transform="translate(25 270)" filter="url(#shadow)">
    <rect width="220" height="110" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <use href="#icon-settings" x="26.37" y="14" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="70.95" y="38.2" font-size="20">Playwright</text>
    <text class="node-subtitle" x="110" y="69" font-size="16">Controls both browser</text>
    <text class="node-subtitle" x="110" y="91" font-size="16">sessions</text>
  </g>
  <g class="node-icon-only node-purple" transform="translate(290 55)">
    <use href="#icon-browser" x="0" y="0" width="160" height="112" color="#7c3aed"/>
    <text class="icon-node-title" x="80" y="137">Interviewer browser</text>
  </g>
  <g class="node-icon-only node-purple" transform="translate(290 483)">
    <use href="#icon-browser" x="0" y="0" width="160" height="112" color="#7c3aed"/>
    <text class="icon-node-title" x="80" y="137">Candidate browser</text>
  </g>
  <g class="node node-purple" transform="translate(500 270)" filter="url(#shadow)">
    <rect width="240" height="110" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <use href="#icon-websocket" x="24.91" y="14" width="34" height="34" color="#7c3aed"/>
    <text class="node-title icon-copy" x="66.66" y="38.2" font-size="20">Shared room</text>
    <text class="node-subtitle" x="120" y="69" font-size="16">Bidirectional WebSocket</text>
    <text class="node-subtitle" x="120" y="91" font-size="16">sync</text>
  </g>
  <g class="node node-amber" transform="translate(790 270)" filter="url(#shadow)">
    <rect width="240" height="110" rx="18" fill="#fff7ed" stroke="#c2410c"/>
    <use href="#icon-api" x="54.06" y="14" width="34" height="34" color="#c2410c"/>
    <text class="node-title icon-copy" x="97.24" y="38.2" font-size="20">FastAPI</text>
    <text class="node-subtitle" x="120" y="69" font-size="16">Sessions and canvas</text>
    <text class="node-subtitle" x="120" y="91" font-size="16">events</text>
  </g>
  <g class="node-icon-only node-green" transform="translate(868 485)">
    <use href="#icon-database" x="0" y="0" width="84" height="84" color="#15803d"/>
    <text class="icon-node-title" x="42" y="109">Postgres database</text>
  </g>
</svg>
