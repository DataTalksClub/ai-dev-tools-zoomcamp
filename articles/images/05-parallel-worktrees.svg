<svg xmlns="http://www.w3.org/2000/svg" width="970" height="600" viewBox="0 0 970 600" role="img" aria-labelledby="title desc">
  <title id="title">Parallel agents in isolated worktrees</title>
  <desc id="desc">The orchestrator assigns independent issues to as many as five isolated worktrees, then merges approved branches into main one at a time.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#15803d"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <symbol id="icon-github" viewBox="0 0 24 24">
        <path fill="currentColor" d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.11.79-.25.79-.56v-2.23c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.04 1.77 2.72 1.26 3.38.96.1-.75.4-1.26.74-1.55-2.57-.29-5.27-1.28-5.27-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.16 1.18a10.9 10.9 0 0 1 5.76 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.71 5.38-5.29 5.67.42.36.79 1.06.79 2.14v3.27c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/>
      </symbol>
    <symbol id="icon-number-1" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 9.5 12.4 8v8M10.2 16h4.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-number-2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.4 9.6a2.6 2.6 0 1 1 5.2.4c0 2-5.2 3.6-5.2 6h5.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-pull-request" viewBox="0 0 24 24">
        <circle cx="6" cy="5" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="6" cy="19" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="19" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 7.5v9M15 5h1a2 2 0 0 1 2 2v9.5M13 2l3 3-3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-robot" viewBox="0 0 24 24">
        <path d="M12 5V2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="12" cy="2.5" r="1" fill="currentColor"/>
        <rect x="4" y="5" width="16" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M4 10H2.5v5H4M20 10h1.5v5H20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="9" cy="11" r="1.3" fill="currentColor"/>
        <circle cx="15" cy="11" r="1.3" fill="currentColor"/>
        <path d="M8.5 16h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-size: 20px; font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-size: 16px; font-weight: 500; fill: #475569; text-anchor: middle; }
      .eyebrow { font-size: 13px; font-weight: 750; letter-spacing: 1px; fill: #475569; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #f1f5f9; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #334155; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #475569; text-anchor: middle; }
    </style>
  </defs>
  <rect width="970" height="600" fill="#ffffff"/>

  <path class="edge" d="M250 300H300V120H350" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M250 300L350 300" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M250 300H300V480H350" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M570 120H645V193.33H720" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M570 300H645V210H720" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M570 480H645V226.67H720" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M830 260L830 340" stroke="#15803d" marker-end="url(#arrow-green)"/>

  <g class="node node-purple" transform="translate(30 250)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <use href="#icon-robot" x="22.03" y="9" width="34" height="34" color="#7c3aed"/>
    <text class="node-title icon-copy" x="65.92" y="32.48" font-size="18">Orchestrator</text>
    <text class="node-subtitle" x="110" y="64" font-size="16">Assigns independent</text>
    <text class="node-subtitle" x="110" y="86" font-size="16">issues</text>
  </g>
  <g class="node node-blue" transform="translate(350 70)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <text class="eyebrow" x="110" y="20" font-size="13">ISOLATED WORKTREE</text>
    <use href="#icon-number-1" x="18.09" y="30" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="62.66" y="53.48" font-size="18">Issue A agent</text>
    <text class="node-subtitle" x="110" y="85" font-size="16">Worktree issue-a</text>
  </g>
  <g class="node node-blue" transform="translate(350 250)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <text class="eyebrow" x="110" y="20" font-size="13">ISOLATED WORKTREE</text>
    <use href="#icon-number-2" x="18.15" y="30" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="62.72" y="53.48" font-size="18">Issue B agent</text>
    <text class="node-subtitle" x="110" y="85" font-size="16">Worktree issue-b</text>
  </g>
  <g class="node node-blue" transform="translate(350 430)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <text class="eyebrow" x="110" y="20" font-size="13">ISOLATED WORKTREES</text>
    <use href="#icon-robot" x="29.91" y="30" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="73.8" y="53.48" font-size="18">Agents 3–5</text>
    <text class="node-subtitle" x="110" y="85" font-size="16">Three more tracks</text>
  </g>
  <g class="node node-amber" transform="translate(720 160)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#fff7ed" stroke="#c2410c"/>
    <use href="#icon-pull-request" x="20.54" y="9" width="34" height="34" color="#c2410c"/>
    <text class="node-title icon-copy" x="62.87" y="32.48" font-size="18">Merge queue</text>
    <text class="node-subtitle" x="110" y="64" font-size="16">Only approved</text>
    <text class="node-subtitle" x="110" y="86" font-size="16">branches</text>
  </g>
  <g class="node node-green" transform="translate(720 340)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#ecfdf5" stroke="#15803d"/>
    <use href="#icon-github" x="24.25" y="9" width="34" height="34" color="#15803d"/>
    <text class="node-title icon-copy" x="69.4" y="32.48" font-size="18">Main branch</text>
    <text class="node-subtitle" x="110" y="64" font-size="16">Merge one issue at a</text>
    <text class="node-subtitle" x="110" y="86" font-size="16">time</text>
  </g>
</svg>
