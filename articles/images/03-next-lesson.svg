<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="800" viewBox="0 0 1520 800" role="img" aria-labelledby="title desc">
  <title id="title">Operate the application after deployment</title>
  <desc id="desc">A user pushes a code change to main, where CI/CD deploys it to the development environment. The user manually promotes the release to production. Production telemetry is collected in an observability platform, which triggers alerts. An AI agent investigates the alert and creates a fix that goes back through the same delivery path.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#15803d"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <symbol id="icon-api" viewBox="0 0 24 24">
        <path d="m8 5-5 7 5 7M16 5l5 7-5 7M14 3l-4 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-aws" viewBox="0 0 24 24">
        <text x="12" y="14" text-anchor="middle" fill="currentColor" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="800" letter-spacing=".15">AWS</text>
        <path d="M3.3 17.2c4.6 2.4 10.3 2.6 17 .2M17.4 16.3l3.3 1-.9 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-container" viewBox="0 0 24 24">
        <rect x="2" y="5" width="20" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M7 5v14M12 5v14M17 5v14" fill="none" stroke="currentColor" stroke-width="2"/>
      </symbol>
    <symbol id="icon-database" viewBox="0 0 24 24">
        <ellipse cx="12" cy="5" rx="8" ry="3" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M4 5v7c0 1.66 3.58 3 8 3s8-1.34 8-3V5M4 12v7c0 1.66 3.58 3 8 3s8-1.34 8-3v-7" fill="none" stroke="currentColor" stroke-width="2"/>
      </symbol>
    <symbol id="icon-github" viewBox="0 0 24 24">
        <path fill="currentColor" d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.11.79-.25.79-.56v-2.23c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.04 1.77 2.72 1.26 3.38.96.1-.75.4-1.26.74-1.55-2.57-.29-5.27-1.28-5.27-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.16 1.18a10.9 10.9 0 0 1 5.76 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.71 5.38-5.29 5.67.42.36.79 1.06.79 2.14v3.27c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/>
      </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-sparkles" viewBox="0 0 24 24">
        <path d="m12 2 1.4 4.6L18 8l-4.6 1.4L12 14l-1.4-4.6L6 8l4.6-1.4ZM19 14l.8 2.2L22 17l-2.2.8L19 20l-.8-2.2L16 17l2.2-.8ZM5 14l.8 2.2L8 17l-2.2.8L5 20l-.8-2.2L2 17l2.2-.8Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-user" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M4 22c.6-5 3.3-7 8-7s7.4 2 8 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-warning" viewBox="0 0 24 24">
        <path d="M12 3 2.5 21h19Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 9v5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.5" r="1.1" fill="currentColor"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-size: 20px; font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-size: 16px; font-weight: 500; fill: #475569; text-anchor: middle; }
      .eyebrow { font-size: 13px; font-weight: 750; letter-spacing: 1px; fill: #475569; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #f1f5f9; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #334155; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #475569; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1520" height="800" fill="#ffffff"/>

  <g class="node-boundary node-blue" transform="translate(20 120)">
    <rect width="1480" height="230" rx="22" fill="none" stroke="#2563eb"/>
    <text class="boundary-title" x="20" y="31">Delivery environments</text>
  </g>
  <g class="node-boundary node-green" transform="translate(20 500)">
    <rect width="260" height="250" rx="22" fill="none" stroke="#15803d"/>
    <text class="boundary-title" x="20" y="31">Respond</text>
  </g>
  <g class="node-boundary node-purple" transform="translate(300 500)">
    <rect width="1200" height="250" rx="22" fill="none" stroke="#7c3aed"/>
    <text class="boundary-title" x="20" y="31">Observe</text>
  </g>
  <path class="edge" d="M260 230L340 230" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M560 230L640 230" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
  <path class="edge" d="M860 230L940 230" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
  <path class="edge" d="M1160 230L1240 230" stroke="#15803d" stroke-dasharray="8 8"/>
  <path class="edge" d="M879 48L450 48L450 180" stroke="#2563eb" stroke-dasharray="8 8" marker-end="url(#arrow-blue)"/>
  <g class="edge-label" transform="translate(450 48)">
    <rect x="-52.5" y="-16" width="105" height="32" rx="16" fill="#ffffff" stroke="#2563eb"/>
    <text fill="#2563eb">Push code</text>
  </g>
  <path class="edge" d="M921 48L1350 48L1350 180" stroke="#15803d" stroke-dasharray="8 8" marker-end="url(#arrow-green)"/>
  <g class="edge-label" transform="translate(1350 48)">
    <rect x="-84.0" y="-16" width="168" height="32" rx="16" fill="#ffffff" stroke="#15803d"/>
    <text fill="#15803d">Manual promotion</text>
  </g>
  <path class="edge" d="M1350 280L1350 585" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M1240 635L1010 635" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
  <path class="edge" d="M790 635L560 635" stroke="#dc2626" marker-end="url(#arrow-red)"/>
  <path class="edge" d="M340 635L260 635" stroke="#15803d" marker-end="url(#arrow-green)"/>
  <path class="edge" d="M150 585V432.5H150V280" stroke="#15803d" stroke-dasharray="8 8" marker-end="url(#arrow-green)"/>
  <g class="edge-label" transform="translate(150 432.5)">
    <rect x="-31.0" y="-16" width="62" height="32" rx="16" fill="#ffffff" stroke="#15803d"/>
    <text fill="#15803d">Fix</text>
  </g>

  <g class="node-icon-only node-blue" transform="translate(872 20)">
    <use href="#icon-user" x="0" y="0" width="56" height="56" color="#2563eb"/>
    <text class="icon-node-title" x="28" y="81">User</text>
  </g>
  <g class="node node-blue" transform="translate(40 180)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <use href="#icon-api" x="60.28" y="20" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="103.46" y="43.84" font-size="19">Code</text>
    <text class="node-subtitle" x="110" y="75" font-size="16">Application change</text>
  </g>
  <g class="node node-blue" transform="translate(340 180)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <use href="#icon-github" x="17" y="20" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="62.15" y="43.84" font-size="19">Push to main</text>
    <text class="node-subtitle" x="110" y="75" font-size="16">Commit to GitHub</text>
  </g>
  <g class="node node-purple" transform="translate(640 180)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <use href="#icon-settings" x="58.26" y="20" width="34" height="34" color="#7c3aed"/>
    <text class="node-title icon-copy" x="102.83" y="43.84" font-size="19">CI/CD</text>
    <text class="node-subtitle" x="110" y="75" font-size="16">Test and deploy</text>
  </g>
  <g class="node node-blue" transform="translate(940 180)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <use href="#icon-container" x="15.87" y="20" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="59.05" y="43.84" font-size="19">Development</text>
    <text class="node-subtitle" x="110" y="75" font-size="16">Validate the release</text>
  </g>
  <g class="node node-green" transform="translate(1240 180)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#ecfdf5" stroke="#15803d"/>
    <use href="#icon-aws" x="28.63" y="20" width="34" height="34" color="#15803d"/>
    <text class="node-title icon-copy" x="70.38" y="43.84" font-size="19">Production</text>
    <text class="node-subtitle" x="110" y="75" font-size="16">Serve real users</text>
  </g>
  <g class="node node-green" transform="translate(40 585)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#ecfdf5" stroke="#15803d"/>
    <use href="#icon-sparkles" x="41.96" y="9" width="34" height="34" color="#15803d"/>
    <text class="node-title icon-copy" x="86.26" y="32.84" font-size="19">AI agent</text>
    <text class="node-subtitle" x="110" y="64" font-size="16">Investigate + create</text>
    <text class="node-subtitle" x="110" y="86" font-size="16">fix</text>
  </g>
  <g class="node node-blue" transform="translate(1240 585)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <use href="#icon-settings" x="39.32" y="20" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="83.89" y="43.84" font-size="19">Collector</text>
    <text class="node-subtitle" x="110" y="75" font-size="16">Logs + metrics</text>
  </g>
  <g class="node node-purple" transform="translate(790 585)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <use href="#icon-database" x="15.51" y="20" width="34" height="34" color="#7c3aed"/>
    <text class="node-title icon-copy" x="57.26" y="43.84" font-size="19">Observability</text>
    <text class="node-subtitle" x="110" y="75" font-size="16">Store and visualize</text>
  </g>
  <g class="node node-red" transform="translate(340 585)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#fef2f2" stroke="#dc2626"/>
    <use href="#icon-warning" x="44.07" y="20" width="34" height="34" color="#dc2626"/>
    <text class="node-title icon-copy" x="87.79" y="43.84" font-size="19">Alerting</text>
    <text class="node-subtitle" x="110" y="75" font-size="16">Detect a problem</text>
  </g>
</svg>
