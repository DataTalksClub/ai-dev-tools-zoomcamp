<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720" role="img" aria-labelledby="title desc">
  <title id="title">Deliver, observe, and respond</title>
  <desc id="desc">A user pushes a change to CI/CD, which deploys it to Development. A release owner manually promotes the tested release to Production. Telemetry flows through the observability path, and an AI agent can prepare a fix for the next change.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#15803d"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <symbol id="icon-environment" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <rect x="3" y="13" width="18" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M7 7h7M7 17h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="17" cy="7" r="1" fill="currentColor"/><circle cx="17" cy="17" r="1" fill="currentColor"/>
      </symbol>
    <symbol id="icon-observability" viewBox="0 0 24 24">
        <rect x="2" y="3" width="17" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M6 13v-3M10 13V7M14 13V9M7 21h7M10.5 17v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="18" cy="15" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="18" cy="15" r="1" fill="currentColor"/>
        <path d="m21 18 2 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-robot" viewBox="0 0 24 24">
        <path d="M12 5V2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="12" cy="2.5" r="1" fill="currentColor"/>
        <rect x="4" y="5" width="16" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M4 10H2.5v5H4M20 10h1.5v5H20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="9" cy="11" r="1.3" fill="currentColor"/>
        <circle cx="15" cy="11" r="1.3" fill="currentColor"/>
        <path d="M8.5 16h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-user" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M4 22c.6-5 3.3-7 8-7s7.4 2 8 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-warning" viewBox="0 0 24 24">
        <path d="M12 3 2.5 21h19Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 9v5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.5" r="1.1" fill="currentColor"/>
      </symbol>
    <symbol id="icon-workflow" viewBox="0 0 24 24">
        <path d="M4 11A8.5 8.5 0 0 1 19.5 8.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M19.5 4.5v4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M20 13A8.5 8.5 0 0 1 4.5 15.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M4.5 19.5v-4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-size: 20px; font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-size: 16px; font-weight: 500; fill: #475569; text-anchor: middle; }
      .eyebrow { font-size: 13px; font-weight: 750; letter-spacing: 1px; fill: #475569; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge-boundary-halo { fill: none; stroke: #ffffff; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #f1f5f9; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #334155; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #475569; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1080" height="720" fill="#ffffff"/>

  <g class="node-boundary node-purple" transform="translate(390 60)">
    <rect width="300" height="380" rx="22" fill="none" stroke="#7c3aed"/>
    <text class="boundary-title" x="20" y="31">CI/CD</text>
  </g>
  <g class="node-boundary node-green" transform="translate(20 500)">
    <rect width="300" height="200" rx="22" fill="none" stroke="#15803d"/>
    <text class="boundary-title" x="20" y="31">Respond</text>
  </g>
  <g class="node-boundary node-purple" transform="translate(390 500)">
    <rect width="670" height="200" rx="22" fill="none" stroke="#7c3aed"/>
    <text class="boundary-title" x="20" y="31">Observe</text>
  </g>
  <path class="edge-boundary-halo" d="M191 150L430 150"/>
  <path class="edge" d="M191 150L430 150" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <g class="edge-label" transform="translate(310.5 150)">
    <rect x="-31.21" y="-16" width="62.41" height="32" rx="16.0" fill="#ffffff" stroke="#2563eb"/>
    <text fill="#2563eb">Push</text>
  </g>
  <path class="edge-boundary-halo" d="M650 150L800 150"/>
  <path class="edge" d="M650 150L800 150" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
  <path class="edge-boundary-halo" d="M191 350L430 350"/>
  <path class="edge" d="M191 350L430 350" stroke="#15803d" stroke-dasharray="8 8" marker-end="url(#arrow-green)"/>
  <g class="edge-label" transform="translate(310.5 350)">
    <rect x="-40.7" y="-16" width="81.4" height="32" rx="16.0" fill="#ffffff" stroke="#15803d"/>
    <text fill="#15803d">Manual</text>
  </g>
  <path class="edge-boundary-halo" d="M650 350L800 350"/>
  <path class="edge" d="M650 350L800 350" stroke="#15803d" marker-end="url(#arrow-green)"/>
  <path class="edge-boundary-halo" d="M910 400L910 560"/>
  <path class="edge" d="M910 400L910 560" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M800 610L650 610" stroke="#dc2626" marker-end="url(#arrow-red)"/>
  <path class="edge-boundary-halo" d="M430 610L280 610"/>
  <path class="edge" d="M430 610L280 610" stroke="#15803d" marker-end="url(#arrow-green)"/>

  <g class="node-icon-only node-blue" transform="translate(142 122)">
    <use href="#icon-user" x="0" y="0" width="56" height="56" color="#2563eb"/>
    <text class="icon-node-title" x="28" y="81">User</text>
  </g>
  <g class="node node-purple" transform="translate(430 100)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <use href="#icon-workflow" x="16" y="20" width="34" height="34" color="#7c3aed"/>
    <text class="node-title icon-copy" x="62" y="43.48" font-size="18">Deploy</text>
    <text class="node-subtitle" x="110" y="75" font-size="16">Ship the change</text>
  </g>
  <g class="node node-blue" transform="translate(800 100)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <use href="#icon-environment" x="16" y="20" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="62" y="43.48" font-size="18">Development</text>
    <text class="node-subtitle" x="110" y="75" font-size="16">Validate the release</text>
  </g>
  <g class="node-icon-only node-blue" transform="translate(142 322)">
    <use href="#icon-user" x="0" y="0" width="56" height="56" color="#2563eb"/>
    <text class="icon-node-title" x="28" y="81">Release owner</text>
  </g>
  <g class="node node-purple" transform="translate(430 300)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <use href="#icon-workflow" x="16" y="20" width="34" height="34" color="#7c3aed"/>
    <text class="node-title icon-copy" x="62" y="43.48" font-size="18">Prod release</text>
    <text class="node-subtitle" x="110" y="75" font-size="16">Promote tested release</text>
  </g>
  <g class="node node-green" transform="translate(800 300)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#ecfdf5" stroke="#15803d"/>
    <use href="#icon-environment" x="16" y="20" width="34" height="34" color="#15803d"/>
    <text class="node-title icon-copy" x="62" y="43.48" font-size="18">Production</text>
    <text class="node-subtitle" x="110" y="75" font-size="16">Serve real users</text>
  </g>
  <g class="node node-green" transform="translate(60 560)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#ecfdf5" stroke="#15803d"/>
    <use href="#icon-robot" x="16" y="9" width="34" height="34" color="#15803d"/>
    <text class="node-title icon-copy" x="62" y="32.48" font-size="18">AI agent</text>
    <text class="node-subtitle" x="110" y="64" font-size="16">Investigate + create</text>
    <text class="node-subtitle" x="110" y="86" font-size="16">fix</text>
  </g>
  <g class="node node-red" transform="translate(430 560)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#fef2f2" stroke="#dc2626"/>
    <use href="#icon-warning" x="16" y="20" width="34" height="34" color="#dc2626"/>
    <text class="node-title icon-copy" x="62" y="43.48" font-size="18">Alerting</text>
    <text class="node-subtitle" x="110" y="75" font-size="16">Detect a problem</text>
  </g>
  <g class="node node-purple" transform="translate(800 560)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <use href="#icon-observability" x="16" y="9" width="34" height="34" color="#7c3aed"/>
    <text class="node-title icon-copy" x="62" y="32.48" font-size="18">Observability</text>
    <text class="node-subtitle" x="110" y="64" font-size="16">Collect and inspect</text>
    <text class="node-subtitle" x="110" y="86" font-size="16">telemetry</text>
  </g>
</svg>
