<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440" role="img" aria-labelledby="title desc">
  <title id="title">Fresh roles with an independent QA loop</title>
  <desc id="desc">Product manager, engineer, and QA roles run sequentially in separate fresh contexts; QA failure returns work to the engineer while QA pass closes the issue.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#15803d"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <symbol id="icon-check" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="m7.5 12 3 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-issue" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M12 7v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1.2" fill="currentColor"/>
      </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24">
        <path d="M12 2.5 20 6v5.5c0 5-3.1 8.6-8 10-4.9-1.4-8-5-8-10V6Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <path d="m8.5 12 2.2 2.2 4.8-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-size: 20px; font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-size: 16px; font-weight: 500; fill: #475569; text-anchor: middle; }
      .eyebrow { font-size: 13px; font-weight: 750; letter-spacing: 1px; fill: #475569; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #f1f5f9; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #334155; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #475569; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1040" height="440" fill="#ffffff"/>

  <path class="edge" d="M230 150L280 150" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M480 150L530 150" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M630 215.4V338.8H380V219.8" stroke="#c2410c" marker-end="url(#arrow-amber)"/>
  <g class="edge-label" transform="translate(505 338.8)">
    <rect x="-31" y="-16" width="62" height="32" rx="16.0" fill="#ffffff" stroke="#c2410c"/>
    <text fill="#c2410c">FAIL</text>
  </g>
  <path class="edge" d="M730 150L810 150" stroke="#15803d" marker-end="url(#arrow-green)"/>

  <g class="node node-blue" transform="translate(30 100)" filter="url(#shadow)">
    <rect width="200" height="100" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <text class="eyebrow" x="100" y="20" font-size="13">FRESH CONTEXT</text>
    <use href="#icon-issue" x="23.72" y="30" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="66.9" y="54.2" font-size="20">PM agent</text>
    <text class="node-subtitle" x="100" y="85" font-size="16">Grooms the issue</text>
  </g>
  <g class="node node-amber" transform="translate(280 100)" filter="url(#shadow)">
    <rect width="200" height="100" rx="18" fill="#fff7ed" stroke="#c2410c"/>
    <text class="eyebrow" x="100" y="9" font-size="13">FRESH CONTEXT</text>
    <use href="#icon-settings" x="26.94" y="19" width="34" height="34" color="#c2410c"/>
    <text class="node-title icon-copy" x="71.51" y="43.2" font-size="20">Engineer</text>
    <text class="node-subtitle" x="100" y="74" font-size="16">Implements the</text>
    <text class="node-subtitle" x="100" y="96" font-size="16">issue</text>
  </g>
  <g class="node node-purple" transform="translate(530 100)" filter="url(#shadow)">
    <rect width="200" height="100" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <text class="eyebrow" x="100" y="20" font-size="13">FRESH CONTEXT</text>
    <use href="#icon-shield" x="24.78" y="30" width="34" height="34" color="#7c3aed"/>
    <text class="node-title icon-copy" x="67.96" y="54.2" font-size="20">QA agent</text>
    <text class="node-subtitle" x="100" y="85" font-size="16">Checks the result</text>
  </g>
  <g class="node node-green" transform="translate(810 100)" filter="url(#shadow)">
    <rect width="200" height="100" rx="18" fill="#ecfdf5" stroke="#15803d"/>
    <use href="#icon-check" x="14.22" y="20" width="34" height="34" color="#15803d"/>
    <text class="node-title icon-copy" x="57.4" y="44.2" font-size="20">Close issue</text>
    <text class="node-subtitle" x="100" y="75" font-size="16">All checks passed</text>
  </g>
</svg>
