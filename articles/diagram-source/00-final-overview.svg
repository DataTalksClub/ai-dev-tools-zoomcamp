  <path class="edge" d="M860 170V210H490V250" stroke="#2563eb" stroke-dasharray="8 8" marker-end="url(#arrow-blue)"/>
  <path class="edge-boundary-halo" d="M109 258L380 300" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M109 258L380 300" stroke="#15803d" stroke-dasharray="8 8" marker-end="url(#arrow-green)"/>
  <g class="edge-label" transform="translate(244.5 279)">
    <rect x="-40.7" y="-16" width="81.4" height="32" rx="16.0" fill="#ffffff" stroke="#15803d"/>
    <text fill="#15803d">Manual</text>
  </g>
  <path class="edge-boundary-halo" d="M600 300L895 300L895 400" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M600 300L895 300L895 400" stroke="#15803d" marker-end="url(#arrow-green)"/>
  <path class="edge-boundary-halo" d="M180 426H485V433.33H790" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M180 426H485V433.33H790" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
  <path class="edge-boundary-halo" d="M180 576H485V466.67H790" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M180 576H485V466.67H790" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
  <path class="edge" d="M1000 450L1030 450" stroke="#15803d" marker-end="url(#arrow-green)"/>
  <path class="edge-boundary-halo" d="M895 500V620H1200V740" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M895 500V620H1200V740" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M1090 790L1010 790" stroke="#dc2626" marker-end="url(#arrow-red)"/>
  <path class="edge-boundary-halo" d="M790 790L280 790" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M790 790L280 790" stroke="#15803d" marker-end="url(#arrow-green)"/>

  <g class="node-icon-only node-blue" transform="translate(60 90)">
    <use href="#icon-user" x="0" y="0" width="56" height="56" color="#2563eb"/>
    <text class="icon-node-title" x="28" y="81">You</text>
  </g>
  <g class="node node-purple" transform="translate(380 70)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <use href="#icon-workflow" x="16" y="20" width="34" height="34" color="#7c3aed"/>
    <text class="node-title icon-copy" x="62" y="39.88" font-size="8">Deploy</text>
    <text class="node-subtitle" x="110" y="75" font-size="16">Ship the change</text>
  </g>
  <g class="node node-blue" transform="translate(750 70)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <use href="#icon-environment" x="16" y="20" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="62" y="39.88" font-size="8">Development</text>
    <text class="node-subtitle" x="110" y="75" font-size="16">Validate the release</text>
  </g>
  <g class="node-icon-only node-blue" transform="translate(60 230)">
    <use href="#icon-user" x="0" y="0" width="56" height="56" color="#2563eb"/>
    <text class="icon-node-title" x="28" y="81">Release owner</text>
  </g>
  <g class="node node-purple" transform="translate(380 250)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <use href="#icon-workflow" x="16" y="20" width="34" height="34" color="#7c3aed"/>
    <text class="node-title icon-copy" x="62" y="39.88" font-size="8">Prod release</text>
    <text class="node-subtitle" x="110" y="75" font-size="16">Promote tested release</text>
  </g>
  <g class="node-icon-only node-blue" transform="translate(20 370)">
    <use href="#icon-browser" x="0" y="0" width="160" height="112" color="#2563eb"/>
