    <text class="node-subtitle" x="105" y="85" font-size="16">Frontend + backend</text>
  </g>
  <g class="node node-green" transform="translate(1030 400)" filter="url(#shadow)">
    <rect width="210" height="100" rx="18" fill="#ecfdf5" stroke="#15803d"/>
    <text class="eyebrow" x="105" y="9" font-size="13">CONTAINER</text>
    <use href="#icon-container" x="16" y="19" width="34" height="34" color="#15803d"/>
    <text class="node-title icon-copy" x="62" y="38.88" font-size="8">Postgres</text>
    <text class="node-subtitle" x="105" y="74" font-size="16">Groups, requests,</text>
    <text class="node-subtitle" x="105" y="96" font-size="16">relay links</text>
  </g>
  <g class="node node-green" transform="translate(60 740)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#ecfdf5" stroke="#15803d"/>
    <use href="#icon-robot" x="16" y="20" width="34" height="34" color="#15803d"/>
    <text class="node-title icon-copy" x="62" y="39.88" font-size="8">AI agent</text>
    <text class="node-subtitle" x="110" y="75" font-size="16">Investigate + patch</text>
  </g>
  <g class="node node-red" transform="translate(790 740)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#fef2f2" stroke="#dc2626"/>
    <use href="#icon-warning" x="16" y="20" width="34" height="34" color="#dc2626"/>
    <text class="node-title icon-copy" x="62" y="39.88" font-size="8">Alerting</text>
    <text class="node-subtitle" x="110" y="75" font-size="16">Failed joins or kickoffs</text>
  </g>
  <g class="node node-purple" transform="translate(1090 740)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
